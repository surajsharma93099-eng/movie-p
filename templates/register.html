{% extends 'base.html' %}

{% block content %}
<div class="ticket-wrap">
    <div class="marquee-bulbs"></div>
    <div class="ticket">

        <div class="ticket-poster">
            <div class="poster-icon"><i class="fa-solid fa-ticket"></i></div>
            <p class="poster-eyebrow">PRODUCER'S PASS</p>
            <h2 class="poster-title">Every Blockbuster<br>Starts With<br><span class="glow-text">A Pass.</span></h2>
            <p class="poster-sub">Create your client account, submit your movie and track its approval and promotion status live.</p>
            <div class="poster-admit">VIP ENTRY</div>
        </div>

        <div class="ticket-form">
            <div class="status-pill"><i class="fa-solid fa-star"></i> New Client Registration</div>
            <h3 class="auth-title">Get Your <span class="glow-text">Pass</span></h3>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label>Production / Client Name</label>
                    <input type="text" name="name" class="input-field" placeholder="Enter your name or production house" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="input-field" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Phone (optional)</label>
                    <input type="text" name="phone" class="input-field" placeholder="10-digit mobile number" maxlength="15">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="input-field" placeholder="At least 6 characters" required minlength="6">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="input-field" placeholder="Re-enter password" required minlength="6">
                </div>

                <button type="submit" class="btn-primary"><i class="fa-solid fa-ticket"></i> Create My Pass</button>
            </form>

            <p class="auth-switch">
                Already have a pass? <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </div>
    <div class="marquee-bulbs alt"></div>
</div>
{% endblock %}
